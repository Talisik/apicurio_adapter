[project]
name = "apicurio-adapter"
version = "0.1.0"
description = "Pydantic models and enums built from Apicurio Registry schemas."
readme = "README.md"
authors = [{ name = "Mister Nyan", email = "michael.edmund.wong@gmail.com" }]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "json-schema-to-pydantic>=0.4.11",
    "pydantic>=2.10.4",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["ruff>=0.15"]
